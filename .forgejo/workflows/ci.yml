name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax check
        run: find . -name "*.php" -not -path "./.git/*" | xargs php -l

      - name: Version sync check
        run: |
          MAIN_FILE=$(grep -rl "Plugin Name:" --include="*.php" . | grep -v vendor | head -1)
          if [ -z "$MAIN_FILE" ]; then
            echo "❌ Could not find main plugin PHP file"
            exit 1
          fi
          echo "Main plugin file: $MAIN_FILE"

          VERSION=$(head -1 VERSION)
          HEADER_VER=$(grep -m1 "^\* Version:" "$MAIN_FILE" | sed 's/.*Version: *//')
          CONST_VER=$(grep -m1 "define.*_VERSION.*'" "$MAIN_FILE" | sed "s/.*'\(.*\)'.*/\1/")
          CLASS_FILE=$(find includes -name "class-*.php" 2>/dev/null | grep -v activator | grep -v deactivator | grep -v loader | grep -v i18n | head -1)
          CLASS_VER=""
          [ -n "$CLASS_FILE" ] && CLASS_VER=$(grep -m1 "this->version = '" "$CLASS_FILE" 2>/dev/null | sed "s/.*'\(.*\)'.*/\1/")

          ERRORS=0
          check() {
            if [ -n "$1" ] && [ "$1" != "$VERSION" ]; then
              echo "❌ $2: expected $VERSION, got $1"
              ERRORS=1
            fi
          }

          check "$HEADER_VER" "Plugin header Version:"
          check "$CONST_VER"  "Version constant"
          check "$CLASS_VER"  "Class version fallback"

          if [ $ERRORS -ne 0 ]; then exit 1; fi
          echo "✅ All version locations in sync: $VERSION"
