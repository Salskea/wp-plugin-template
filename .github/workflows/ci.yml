name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Composer-tiedostot (lock ajan tasalla)
        run: composer validate --strict

      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - run: composer install --prefer-dist --no-progress

      - name: Koodityyli (PHPCS)
        run: composer lint

      - name: Staattinen analyysi (PHPStan)
        run: composer analyse

      - name: Testit (PHPUnit)
        run: composer test

      # The template repo carries its own CHANGELOG, not the skeleton plugin's.
      - name: Versio sama kaikkialla
        if: github.repository != 'Salskea/wp-plugin-template'
        run: ./scripts/check-version.sh

  # Pushing a new version to main creates the tag and starts the release. A tag pushed with
  # GITHUB_TOKEN does not trigger workflows, so release.yml is dispatched explicitly.
  tag:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository != 'Salskea/wp-plugin-template'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Tagi, jos versio on uusi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source scripts/lib.sh
          TAG="v$(header_version)"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "Tagi $TAG on jo olemassa."
          else
            git tag "$TAG"
            git push origin "$TAG"
            gh workflow run release.yml --ref "$TAG"
            echo "Luotiin $TAG ja käynnistettiin release.yml."
          fi
